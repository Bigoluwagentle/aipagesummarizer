<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Page Summarizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- MAIN VIEW -->
  <div id="app" class="view" data-view="main">

    <header class="header">
      <div class="header-left">
        <div class="logo-mark">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="8" height="8" rx="1.5" fill="currentColor" opacity="0.9"/>
            <rect x="11" y="1" width="8" height="4" rx="1.5" fill="currentColor" opacity="0.5"/>
            <rect x="11" y="7" width="8" height="2" rx="1" fill="currentColor" opacity="0.3"/>
            <rect x="1" y="11" width="18" height="2" rx="1" fill="currentColor" opacity="0.6"/>
            <rect x="1" y="15" width="14" height="2" rx="1" fill="currentColor" opacity="0.4"/>
          </svg>
        </div>
        <span class="logo-text">Summ<em>AI</em></span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
          <svg id="themeIconDark" class="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="themeIconLight" class="theme-icon hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="page-info" id="pageInfo">
      <div class="page-favicon" id="pageFavicon" aria-hidden="true">🌐</div>
      <div class="page-title" id="pageTitle">Loading page info…</div>
    </div>

    <div class="cta-zone" id="ctaZone">
      <button class="btn-primary" id="summarizeBtn" aria-label="Summarize this page">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="21" y1="10" x2="3" y2="10"/>
          <line x1="21" y1="6" x2="3" y2="6"/>
          <line x1="21" y1="14" x2="3" y2="14"/>
          <line x1="21" y1="18" x2="11" y2="18"/>
        </svg>
        Summarize Page
      </button>
    </div>

    <div class="loading-zone hidden" id="loadingZone" aria-live="polite">
      <div class="spinner" aria-hidden="true">
        <div class="spinner-ring"></div>
        <div class="spinner-core"></div>
      </div>
      <p class="loading-text" id="loadingText">Extracting content…</p>
      <div class="loading-bar" aria-hidden="true">
        <div class="loading-bar-fill" id="loadingBarFill"></div>
      </div>
    </div>

    <div class="error-zone hidden" id="errorZone" role="alert">
      <div class="error-icon" aria-hidden="true">⚠️</div>
      <p class="error-text" id="errorText">Something went wrong.</p>
      <div class="error-actions">
        <button class="btn-ghost" id="retryBtn">Try Again</button>
      </div>
    </div>

    <div class="results-zone hidden" id="resultsZone">
      <div class="meta-bar">
        <div class="meta-pill" title="Estimated reading time">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span id="readingTimeText">—</span>
        </div>
        <div class="meta-pill" title="Word count">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/>
          </svg>
          <span id="wordCountText">—</span>
        </div>
        <div class="meta-pill sentiment-pill" id="sentimentPill" title="Sentiment">
          <span id="sentimentIcon">😐</span>
          <span id="sentimentText">—</span>
        </div>
        <div class="meta-badge cache-badge hidden" id="cacheBadge" title="Loaded from cache">CACHED</div>
      </div>

      <div class="topics-row hidden" id="topicsRow">
        <div class="topics-list" id="topicsList"></div>
      </div>

      <section class="summary-section" aria-labelledby="summaryHeading">
        <h2 class="section-heading" id="summaryHeading">Summary</h2>
        <ul class="summary-list" id="summaryList" role="list"></ul>
      </section>

      <section class="insights-section" aria-labelledby="insightsHeading">
        <h2 class="section-heading" id="insightsHeading">Key Insights</h2>
        <ol class="insights-list" id="insightsList" role="list"></ol>
      </section>

      <div class="action-bar">
        <button class="btn-ghost btn-small" id="copyBtn" aria-label="Copy summary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          Copy
        </button>
        <button class="btn-ghost btn-small" id="refreshBtn" aria-label="Refresh summary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Refresh
        </button>
        <button class="btn-ghost btn-small" id="clearBtn" aria-label="Clear summary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6"/><path d="M14 11v6"/>
          </svg>
          Clear
        </button>
      </div>
    </div>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="popup.js"></script>
</body>
</html>
